- defaults:
    link:
      relink: true
      create: true

- clean: ['~']

- link:
    ~/.zshrc: zshrc
    # ~/.zshrc.work: zshrc.work
    ~/.bash_profile: bash_profile
    ~/.profile: profile
    ~/.gitconfig: gitconfig
    ~/.config/alacritty: config/alacritty
    ~/.config/nvim: config/nvim/
    ~/.config/aerospace: config/aerospace/
    ~/.config/tmux/start_session.sh: config/tmux/start_session.sh
    ~/.config/tmux/tmux.conf: config/tmux/tmux.conf
    ~/.config/ghostty/config: config/ghostty/config
    ~/.config/agent-of-empires/config.toml: config/agent-of-empires/config.toml
    ~/Library/Application Support/Code/User/settings.json: config/vscode/settings.json
    ~/Library/Application Support/Code/User/keybindings.json: config/vscode/keybindings.json

- shell:
    - ["git submodule update --init --recursive", Init submodules]
    - ['[ -d ~/.oh-my-zsh ] || RUNZSH=no KEEP_ZSHRC=yes sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)"', Install oh-my-zsh]
    - ["git clone https://github.com/paulirish/git-open ~/.oh-my-zsh/custom/plugins/git-open || true", Clone git-open plugin]
    - ["git clone https://github.com/zsh-users/zsh-autosuggestions ~/.oh-my-zsh/custom/plugins/zsh-autosuggestions || true", Clone zsh-autosuggestions plugin]
    - ["git clone https://github.com/zsh-users/zsh-syntax-highlighting ~/.oh-my-zsh/custom/plugins/zsh-syntax-highlighting || true", Clone zsh-syntax-highlighting plugin]
    - ["git clone https://github.com/tmux-plugins/tpm ~/.config/tmux/plugins/tpm || true", Clone TPM]
    - ["~/.config/tmux/plugins/tpm/bin/install_plugins", Install tmux plugins]
    - [bash macos.sh, Apply macOS system settings]
